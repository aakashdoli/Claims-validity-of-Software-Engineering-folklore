[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "se-claims-tool"
version = "0.2.0"
description = "Two-stage NLP+LLM pipeline for extracting SE folklore claims from practitioner books."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ebooklib",
  "beautifulsoup4",
  "PyMuPDF",
  "pysbd",
  "pandas",
  "openpyxl",
  "openai",
  "streamlit",
  "python-dotenv",
  "requests"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
```

