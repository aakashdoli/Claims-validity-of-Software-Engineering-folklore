[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "se-claims-tool"
version = "0.1.0"
description = "Local tool to extract causal claims from software engineering books (EPUB/PDF) with strict verbatim rules."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ebooklib",
  "beautifulsoup4",
  "PyMuPDF",
  "pysbd",
  "pandas",
  "openpyxl",
  "openai",
  "streamlit",
  "python-dotenv",
  "requests"
]

[project.scripts]
se-claims-tool = "se_claims_tool.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
